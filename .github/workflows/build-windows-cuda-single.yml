name: Build Junba Windows CUDA Fix - Single EXE only

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - '**.py'
      - '**.spec'
      - 'requirements.txt'
      - 'hooks/**'
      - 'tests/**'
      - '.github/workflows/build-windows-cuda-single.yml'

permissions:
  contents: read

jobs:
  windows-cuda-single:
    name: Windows CUDA 12 / cuDNN 9 Single EXE
    runs-on: windows-2022
    timeout-minutes: 180
    # Windows runners may select a legacy cp1252 console encoding.
    # Keep Python and all pip/PyInstaller output consistently UTF-8.
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: 'utf-8'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: 'x64'
      - name: Source preflight
        shell: pwsh
        run: |
          foreach ($path in @('main.py','requirements.txt','app/core/cuda_runtime.py','app/core/worker.py','app/ui/main_window.py','hooks/runtime_safe_windows.py','JunbaAITranscriber_onefile.spec')) {
            if (!(Test-Path $path)) { throw "Missing source: $path" }
          }
          python -m compileall -q main.py app hooks
          if ($LASTEXITCODE -ne 0) { throw 'Python compilation failed' }
      - name: Install Python project and NVIDIA GPU runtime wheels
        shell: pwsh
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -r requirements.txt
          if ($LASTEXITCODE -ne 0) { throw 'Install Python dependencies failed' }
          python -m pip install "nvidia-cublas-cu12==12.4.5.8" "nvidia-cudnn-cu12==9.5.1.17" "nvidia-cuda-runtime-cu12==12.4.127"
          if ($LASTEXITCODE -ne 0) { throw 'Install NVIDIA CUDA 12/cuDNN 9 wheels failed' }
          python -m pip check
          if ($LASTEXITCODE -ne 0) { throw 'pip check failed' }
          python -m pip freeze | Out-File -Encoding utf8 CUDA_BUILD_DEPENDENCIES.txt
      - name: Verify bundled NVIDIA DLL sources
        shell: pwsh
        run: |
          # Do not pipe a Unicode Python report through a cp1252 console.
          # A standalone runner writes a UTF-8 report and ASCII-safe stdout.
          python -X utf8 -m tools.verify_cuda_dlls
          if ($LASTEXITCODE -ne 0) { throw 'NVIDIA DLL preflight failed; check r/CUDA_DLL_SOURCES.txt' }
      - name: Build GPU-enabled Single EXE only
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean JunbaAITranscriber_onefile.spec
          if ($LASTEXITCODE -ne 0) { throw 'PyInstaller build failed' }
          if (!(Test-Path dist/Junba.exe)) { throw 'Single EXE not produced' }
      - name: Verify extracted Single EXE GPU DLLs and GUI
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          New-Item -ItemType Directory -Force -Path r | Out-Null
          $exe = (Resolve-Path dist/Junba.exe).Path
          $checks = @(
            @('--windowed-io-self-test', "$pwd/r/io.txt"),
            @('--ui-self-test', "$pwd/r/ui.txt"),
            @('--cuda-audit', "$pwd/r/cuda_audit.txt")
          )
          foreach ($entry in $checks) {
            $args = [string[]]$entry
            $proc = Start-Process -FilePath $exe -ArgumentList $args -Wait -PassThru
            if ($proc.ExitCode -ne 0) {
              if (Test-Path $args[1]) { Get-Content $args[1] }
              throw "Single EXE test failed: $($args[0]), code $($proc.ExitCode)"
            }
          }
          if (!(Select-String -Path r/cuda_audit.txt -Pattern 'CUDA_AUDIT_OK' -Quiet)) { throw 'Bundled CUDA DLL audit failed' }
          Get-Content r/cuda_audit.txt
          # No NVIDIA GPU on GitHub-hosted Windows runners. Real inference is
          # tested on the user's PC via Settings -> CUDA real inference test.
      - name: Publish one Single EXE and diagnostic report
        shell: pwsh
        run: |
          Copy-Item dist/Junba.exe r/Junba-CUDA-Fix-Single.exe -Force
          $sha = (Get-FileHash r/Junba-CUDA-Fix-Single.exe -Algorithm SHA256).Hash
          "SHA256 $sha  Junba-CUDA-Fix-Single.exe" | Set-Content r/SHA256.txt -Encoding ascii
          "CUDA GPU test skipped on hosted CI (no NVIDIA GPU); please run on RTX device." | Set-Content r/GPU_TEST_REQUIRED.txt -Encoding utf8
          Copy-Item CUDA_BUILD_DEPENDENCIES.txt r/CUDA_BUILD_DEPENDENCIES.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Junba-Windows-CUDA-Fix-Single
          path: |
            r/Junba-CUDA-Fix-Single.exe
            r/SHA256.txt
            r/cuda_audit.txt
            r/GPU_TEST_REQUIRED.txt
            r/CUDA_BUILD_DEPENDENCIES.txt
            r/CUDA_DLL_SOURCES.txt
          if-no-files-found: error
          retention-days: 30
